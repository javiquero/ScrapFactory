<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f3b26">
  <title>Scrap Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game" aria-label="Planeta SC-7"></div>

  <header class="hud">
    <section class="order" id="order" aria-live="polite">
      <div class="order-stamp" aria-hidden="true">Chatarrex</div>
      <img class="order-icon" id="orderIcon" alt="">
      <div class="order-text">
        <div class="order-planet" id="orderPlanet">Planeta 1</div>
        <div class="order-title" id="orderTitle">Pedido 1</div>
        <div class="order-count" id="orderCount">0 / 20 chatarra</div>
        <div class="order-bar"><div class="order-fill" id="orderFill"></div></div>
        <button class="launch" id="launchBtn" hidden>Despegar al planeta 2</button>
      </div>
    </section>
    <button class="wallet" id="wallet" title="Créditos Chatarrex · abrir catálogo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffd84a" stroke="#1f3b26" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#c99a1e" stroke-width="1.6"/><path d="M13.6 9.6a2.6 2.6 0 1 0 0 4.8" fill="none" stroke="#1f3b26" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="walletAmount">0 ₡</span>
    </button>
    <section class="tutorial" id="tutorial" hidden aria-live="polite">
      <div class="tut-step" id="tutStep">Tutorial</div>
      <p class="tut-text" id="tutText"></p>
      <button class="tut-skip" id="tutSkip">Saltar tutorial</button>
    </section>
  </header>

  <div class="memo" id="memo" role="status" hidden>
    <div class="memo-from">Comunicado de Chatarrex S.A.</div>
    <p class="memo-text" id="memoText"></p>
  </div>

  <div class="hint" id="hint" role="alert" hidden></div>

  <section class="inspect" id="inspect" hidden>
    <img class="inspect-icon" id="inspectIcon" alt="">
    <div class="inspect-body">
      <div class="inspect-name" id="inspectName"></div>
      <div class="inspect-info" id="inspectInfo"></div>
    </div>
    <button class="chip" id="inspectRotate">Girar</button>
    <button class="chip chip-danger" id="inspectRemove">Quitar</button>
    <button class="close" id="inspectClose" aria-label="Cerrar">×</button>
  </section>

  <nav class="bar" id="bar" aria-label="Herramientas"></nav>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" aria-label="Catálogo de construcción" aria-hidden="true">
    <div class="panel-head">
      <h2>Catálogo <span class="panel-money" id="panelMoney"></span></h2>
      <button class="close" id="panelClose" aria-label="Cerrar catálogo">×</button>
    </div>
    <div class="panel-list" id="panelList"></div>
    <div class="panel-foot">
      <button class="chip" id="tutAgain">Repetir tutorial</button>
      <button class="chip chip-danger" id="resetBtn">Empezar partida nueva</button>
      <p class="panel-note">Chatarrex solo paga lo que pide el pedido: cada pieza y un extra al completarlo. Se guarda solo.</p>
    </div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
